<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - MFA Face Auth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #0f172a;
      overflow: hidden;
    }
    #tsparticles {
      position: fixed;
      z-index: -1;
      top: 0; left: 0; right: 0; bottom: 0;
    }
  </style>
</head>
<body class="text-white flex items-center justify-center min-h-screen">
  <div id="tsparticles"></div>

  <div class="bg-gray-800 bg-opacity-80 p-10 rounded-xl shadow-2xl w-full max-w-md z-10">
    <h2 class="text-3xl font-semibold text-center text-teal-400 mb-6">Login with Face Auth</h2>
    <form action="/login" method="POST" class="space-y-5">
      <div>
        <label class="block mb-1 text-sm">Username</label>
        <input type="text" name="username" required
          class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:ring-2 focus:ring-teal-400 focus:outline-none">
      </div>
      <div>
        <label class="block mb-1 text-sm">Password</label>
        <input type="password" name="password" required
          class="w-full px-4 py-2 rounded-lg bg-gray-700 border border-gray-600 focus:ring-2 focus:ring-teal-400 focus:outline-none">
      </div>
      <button type="submit"
        class="w-full py-2 px-4 bg-teal-500 hover:bg-teal-600 transition rounded-lg text-white font-semibold">
        Login with MFA
      </button>
    </form>
    <p class="text-center text-sm mt-4 text-gray-400">Don't have an account?
      <a href="/register" class="text-teal-400 hover:underline">Register</a>
    </p>
  </div>

  <script>
    tsParticles.load("tsparticles", {
      background: { color: "#0f172a" },
      fullScreen: { enable: false },
      particles: {
        number: { value: 60 },
        color: { value: "#14b8a6" },
        links: { enable: true, color: "#14b8a6", distance: 110, opacity: 0.5 },
        move: { enable: true, speed: 1 },
        size: { value: { min: 1, max: 3 } },
        opacity: { value: 0.5 }
      },
      interactivity: {
        events: { onHover: { enable: true, mode: "repulse" } },
        modes: { repulse: { distance: 100 } }
      }
    });
  </script>
</body>
</html>
